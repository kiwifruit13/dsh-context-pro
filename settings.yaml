ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    sensenova:
      displayName: 一
      apiKeyEnv: SENSENOVA_API_KEY
      api: openai-completions
      baseURL: https://token.sensenova.cn/v1
      retryPolicy:
        mode: normal
        maxRetries: 5
        backoff:
          initialDelayMs: 4000
          maxDelayMs: 64000
      models:
        - id: deepseek-v4-flash
          name: deepseek-v4-flash
          contextWindow: 262144
        - id: glm-5.2
          name: glm-5.2
          contextWindow: 262144
        - id: sensenova-u1-fast
          name: sensenova-u1-fast
          contextWindow: 262144
        - id: sensenova-6.8-flash-lite
          name: sensenova-6.8-flash-lite
          contextWindow: 262144
    sensenovad:
      displayName: 二
      apiKeyEnv: SENSENOVAD_API_KEY
      api: openai-completions
      baseURL: https://token.sensenova.cn/v1
      retryPolicy:
        mode: normal
        maxRetries: 5
        backoff:
          initialDelayMs: 4000
          maxDelayMs: 64000
      models:
        - id: deepseek-v4-flash
          name: deepseek-v4-flash
          contextWindow: 262144
        - id: glm-5.2
          name: glm-5.2
          contextWindow: 262144
        - id: sensenova-u1-fast
          name: sensenova-u1-fast
          contextWindow: 262144
        - id: sensenova-6.8-flash-lite
          name: sensenova-6.8-flash-lite
          contextWindow: 262144
agent-presets:
  default: cordis
permission:
  defaultPreset: danger-full-access
agent-default-model:
  provider: sensenova
  model: deepseek-v4-flash